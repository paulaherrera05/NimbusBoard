<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NimbusBoard Workspace</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f6f8; color: #333; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .panel-container { background-color: #ffffff; width: 100%; max-width: 450px; padding: 30px; border-radius: 6px; box-shadow: 0 2px 15px rgba(0,0,0,0.06); border-top: 5px solid #0056b3; box-sizing: border-box; display: none; }
        h2 { margin-top: 0; color: #1a1a1a; font-size: 20px; text-align: center; }
        .subtitle { font-size: 13px; color: #666; text-align: center; margin-bottom: 20px; }
        input[type="text"], input[type="password"], select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #dcdcdc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        button:hover { background-color: #004494; }
        .chat-history { height: 350px; background-color: #f9f9f9; border: 1px solid #eaeaea; border-radius: 4px; padding: 15px; overflow-y: auto; margin-bottom: 15px; }
        .msg-line { margin-bottom: 12px; font-size: 14px; padding: 8px; border-radius: 4px; background: white; border-left: 3px solid #0056b3; }
        .author-tag { font-weight: 600; display: block; font-size: 12px; color: #0056b3; }
        .error-msg { color: #dc3545; text-align: center; font-weight: bold; display: none; }
        .link-box { background: #e9ecef; padding: 10px; border-radius: 4px; text-align: center; font-size: 13px; word-break: break-all; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <div class="panel-container" id="create-panel">
        <h2>Crear Entorno Nimbus</h2>
        <div class="subtitle">Despliegue de sala temporal privada</div>
        <select id="horas-select">
            <option value="12">12 Horas</option>
            <option value="24" selected>24 Horas</option>
            <option value="48">48 Horas</option>
            <option value="72">72 Horas</option>
        </select>
        <button onclick="crearSalaWeb()" id="btn-crear">Generar Sala</button>
        <div id="link-result" class="link-box"></div>
        <button onclick="location.reload()" id="btn-ir" style="display:none; background:#6c757d">Ir a la Sala</button>
    </div>

    <div class="panel-container" id="auth-panel">
        <h2>Autenticación</h2>
        <div class="subtitle">Identificación requerida para entrar</div>
        <p id="error-status" class="error-msg">SALA EXPIRADA O INEXISTENTE</p>
        <input type="text" id="username" placeholder="Nombre de usuario">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="iniciarSesion()">Ingresar</button>
    </div>

    <div class="panel-container" id="chat-interface">
        <h2>NimbusBoard Sync</h2>
        <div class="chat-history" id="chat-history"></div>
        <input type="text" id="msg-input" placeholder="Mensaje..." onkeypress="if(event.key==='Enter') transmitirMensaje()">
        <button onclick="transmitirMensaje()">Enviar</button>
    </div>

    <script>
        const APPS_SCRIPT_URL = '{{ link_base_datos }}';
        let usuarioLocal = '', passLocal = '', idSala = new URLSearchParams(window.location.search).get('sala');
        let ultimoCount = 0;

        window.onload = function() {
            if (!idSala) {
                document.getElementById('create-panel').style.display = 'block';
            } else {
                usuarioLocal = sessionStorage.getItem('nimbus_u_' + idSala);
                passLocal = sessionStorage.getItem('nimbus_p_' + idSala);
                if (usuarioLocal && passLocal) entrarAlChat();
                else document.getElementById('auth-panel').style.display = 'block';
            }
        };

        async function crearSalaWeb() {
            const btn = document.getElementById('btn-crear');
            btn.innerText = "Procesando...";
            const res = await fetch('/api/crear', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ horas: document.getElementById('horas-select').value })
            });
            const data = await res.json();
            if(data.exito) {
                btn.style.display = 'none';
                document.getElementById('link-result').style.display = 'block';
                document.getElementById('link-result').innerHTML = `Link: <a href="${data.link}">${data.link}</a>`;
                document.getElementById('btn-ir').style.display = 'block';
            }
        }

        function iniciarSesion() {
            usuarioLocal = document.getElementById('username').value.trim();
            passLocal = document.getElementById('password').value.trim();
            if (!usuarioLocal || !passLocal) return;
            sessionStorage.setItem('nimbus_u_' + idSala, usuarioLocal);
            sessionStorage.setItem('nimbus_p_' + idSala, passLocal);
            entrarAlChat();
        }

        function entrarAlChat() {
            document.getElementById('auth-panel').style.display = 'none';
            document.getElementById('chat-interface').style.display = 'block';
            sincronizar();
            setInterval(sincronizar, 2000);
        }

        function cifrar(t) { return btoa(unescape(encodeURIComponent(t))).split('').reverse().join('') + "Z1"; }
        function descifrar(c) { return decodeURIComponent(escape(atob(c.slice(0,-2).split('').reverse().join('')))); }

        async function transmitirMensaje() {
            const i = document.getElementById('msg-input');
            const t = i.value.trim(); if(!t) return;
            const p = cifrar(t); i.value = '';
            fetch(APPS_SCRIPT_URL, { method: 'POST', body: new URLSearchParams({action:'save', sala:idSala, usuario:usuarioLocal, mensaje:p}) });
            setTimeout(sincronizar, 500);
        }

        async function sincronizar() {
            try {
                const r = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: new URLSearchParams({action:'get', sala:idSala, t:Date.now()}) });
                const d = await r.json();
                if(d.error) { location.reload(); return; }
                if(d.length !== ultimoCount) {
                    const c = document.getElementById('chat-history'); c.innerHTML = '';
                    d.forEach(m => {
                        c.innerHTML += `<div class="msg-line"><span class="author-tag">${m.usuario}</span>${descifrar(m.mensaje)}</div>`;
                    });
                    c.scrollTop = c.scrollHeight;
                    ultimoCount = d.length;
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
